<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#sky)"/>
  <!-- Cloud base -->
  <rect x="0" y="60" width="600" height="130" fill="#9ca3af"/>
  <rect x="0" y="60" width="600" height="50" fill="#d1d5db"/>
  <!-- Mammatus pouches hanging down -->
  <ellipse cx="55"  cy="200" rx="42" ry="35" fill="url(#pouch)"/>
  <ellipse cx="145" cy="205" rx="44" ry="37" fill="url(#pouch)"/>
  <ellipse cx="237" cy="200" rx="43" ry="36" fill="url(#pouch)"/>
  <ellipse cx="328" cy="207" rx="45" ry="38" fill="url(#pouch)"/>
  <ellipse cx="420" cy="201" rx="43" ry="36" fill="url(#pouch)"/>
  <ellipse cx="510" cy="204" rx="42" ry="35" fill="url(#pouch)"/>
  <!-- Second row -->
  <ellipse cx="100" cy="235" rx="38" ry="30" fill="#b0b7c1"/>
  <ellipse cx="192" cy="240" rx="40" ry="32" fill="#b0b7c1"/>
  <ellipse cx="284" cy="237" rx="39" ry="31" fill="#b0b7c1"/>
  <ellipse cx="376" cy="242" rx="40" ry="33" fill="#b0b7c1"/>
  <ellipse cx="468" cy="236" rx="38" ry="30" fill="#b0b7c1"/>
  <!-- Shadow highlights -->
  <ellipse cx="55"  cy="192" rx="25" ry="12" fill="white" opacity="0.2"/>
  <ellipse cx="237" cy="192" rx="25" ry="12" fill="white" opacity="0.2"/>
  <ellipse cx="420" cy="192" rx="25" ry="12" fill="white" opacity="0.2"/>
</svg>
