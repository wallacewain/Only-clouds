<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="600" height="340" fill="url(#sky)"/>
  <!-- Stars -->
  <circle cx="50" cy="30" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="150" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="500" cy="40" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="560" cy="15" r="1" fill="white" opacity="0.5"/>
  <!-- Wispy cirrus streaks -->
  <path d="M 30 100 Q 150 80 280 95 Q 350 100 420 85" stroke="white" stroke-width="12" fill="none" opacity="0.6" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M 50 115 Q 180 98 310 110 Q 380 115 440 100" stroke="white" stroke-width="8" fill="none" opacity="0.4" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M 200 140 Q 320 120 480 135 Q 540 140 590 125" stroke="white" stroke-width="14" fill="none" opacity="0.55" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M 220 155 Q 340 138 500 150" stroke="white" stroke-width="7" fill="none" opacity="0.35" stroke-linecap="round" filter="url(#blur)"/>
  <path d="M 10 170 Q 100 155 200 168 Q 260 175 300 162" stroke="white" stroke-width="10" fill="none" opacity="0.45" stroke-linecap="round" filter="url(#blur)"/>
  <!-- High altitude label feel -->
  <path d="M 350 80 Q 450 65 570 78" stroke="white" stroke-width="9" fill="none" opacity="0.5" stroke-linecap="round" filter="url(#blur)"/>
</svg>
